<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 220" width="620" height="220" font-family="IBM Plex Sans, sans-serif">
  <rect width="620" height="220" fill="#0f1115"/>
  <text x="24" y="34" fill="#e6e9ef" font-size="15" font-weight="600">在庫の状態遷移</text>

  <g stroke="#242a34" stroke-width="1" fill="#13151a">
    <rect x="24"  y="76" width="140" height="50" rx="6"/>
    <rect x="240" y="76" width="140" height="50" rx="6"/>
    <rect x="456" y="76" width="140" height="50" rx="6"/>
  </g>
  <g fill="#c3cad6" font-size="12" text-anchor="middle">
    <text x="94"  y="106">販売可能</text>
    <text x="310" y="106">引当済み</text>
    <text x="526" y="106">確定在庫</text>
  </g>

  <g stroke-width="1.6" fill="none" marker-end="url(#b)">
    <path d="M164 101 H234" stroke="#4f9dff"/>
    <path d="M380 101 H450" stroke="#3fbf8f"/>
    <path d="M310 126 V162 H94 V126" stroke="#e0a83e"/>
  </g>
  <defs>
    <marker id="b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#9aa3b2"/>
    </marker>
  </defs>

  <g fill="#8b93a3" font-size="9.5" text-anchor="middle">
    <text x="199" y="92">引当</text>
    <text x="415" y="92">決済確定</text>
    <text x="202" y="176">30分で自動解放</text>
  </g>
  <text x="24" y="206" fill="#5b626f" font-size="10">与信は7日、引当は30分。与信が生きていても在庫が無い状態は仕様として起こりうる。</text>
</svg>
